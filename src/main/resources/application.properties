spring.application.name=autopartes


# CONFIGURACIÓN GENERAL DEL SERVIDOR

server.port=8080


# CONFIGURACIÓN DE BASE DE DATOS (SQL Server 2022)

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AutopartesDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=AdminAlex
spring.datasource.password=Tecser123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect


# SWAGGER UI (Springdoc OpenAPI)

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html